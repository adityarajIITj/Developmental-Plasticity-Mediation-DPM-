name: tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run smoke comparison
        run: python experiments/smoke_comparison.py
